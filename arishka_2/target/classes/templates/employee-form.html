<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title th:text="${employee.id == null} ? 'Добавление сотрудника' : 'Редактирование сотрудника'">Форма сотрудника</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        .form-group { margin-bottom: 15px; width: 400px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="email"], input[type="number"] { width: 100%; padding: 8px; box-sizing: border-box; }
        .error-message { color: red; font-size: 13px; margin-top: 5px; }
        .btn-submit { background-color: #4CAF50; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-cancel { background-color: #f44336; color: white; padding: 10px 15px; text-decoration: none; border-radius: 4px; margin-left: 10px; display: inline-block; }
        .checkbox-group { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
    </style>
</head>
<body>

<h2 th:text="${employee.id == null} ? 'Добавление нового сотрудника' : 'Редактирование сотрудника'">Форма</h2>

<form th:action="@{/employees/add}" th:object="${employee}" method="post">
    <!-- Скрытое поле ID для режима редактирования -->
    <input type="hidden" th:field="*{id}" />

    <div class="form-group">
        <label for="fullName">ФИО:</label>
        <input type="text" id="fullName" th:field="*{fullName}" />
        <div class="error-message" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}">Ошибка ФИО</div>
    </div>

    <div class="form-group">
        <label for="email">Email:</label>
        <!-- Блокируем изменение email при редактировании, чтобы избежать дубликатов, либо оставляем открытым -->
        <input type="email" id="email" th:field="*{email}" />
        <div class="error-message" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Ошибка Email</div>
    </div>

    <div class="form-group">
        <label for="phone">Телефон:</label>
        <input type="text" id="phone" th:field="*{phone}" placeholder="+79991234567" />
        <div class="error-message" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}">Ошибка телефона</div>
    </div>

    <div class="form-group">
        <label for="position">Должность:</label>
        <input type="text" id="position" th:field="*{position}" />
        <div class="error-message" th:if="${#fields.hasErrors('position')}" th:errors="*{position}">Ошибка должности</div>
    </div>

    <div class="form-group">
        <label for="salary">Зарплата:</label>
        <input type="number" step="0.01" id="salary" th:field="*{salary}" />
        <div class="error-message" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}">Ошибка зарплаты</div>
    </div>

    <div class="form-group checkbox-group">
        <input type="checkbox" id="active" th:field="*{active}" />
        <label for="active">Активный сотрудник</label>
    </div>

    <button type="submit" class="btn-submit">Сохранить</button>
    <a th:href="@{/employees}" class="btn-cancel">Отмена</a>
</form>

</body>
</html>
